spring:
  application:
    name: master-prj-backend

  datasource:
    url: jdbc:postgresql://postgres:5432/masterprj
    username: masterprj
    # From the environment (.env on the server, see .env.example); never in git.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Only the liveness check. info and metrics were public before.
        include: health

# API docs are off unless explicitly enabled for local development.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

# Access tokens and CORS origins (StudyAccessFilter). Set in .env on the server.
study:
  write-token: ${STUDY_WRITE_TOKEN:}
  read-token: ${STUDY_READ_TOKEN:}
  allowed-origins: ${STUDY_ALLOWED_ORIGINS:https://master-prj-pwa.vercel.app}
